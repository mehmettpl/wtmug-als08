<html lang="tr">
<head>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 12px 20px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 18px; }
    .status { font-size: 13px; padding: 4px 10px; border-radius: 12px; background: #475569; }
    .status.connected { background: #16a34a; }
    .status.waiting { background: #ca8a04; }
    #qrScreen { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; padding: 20px; }
    #qrScreen h2 { font-size: 22px; color: #94a3b8; }
    #qrcode { background: #fff; padding: 16px; border-radius: 12px; }
    #peerIdText { font-family: monospace; color: #38bdf8; font-size: 14px; word-break: break-all; max-width: 400px; text-align: center; }
    .hint { color: #64748b; font-size: 13px; text-align: center; max-width: 400px; }
    #chatScreen { flex: 1; display: none; flex-direction: column; overflow: hidden; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 70%; padding: 10px 14px; border-radius: 12px; word-wrap: break-word; font-size: 14px; }
    .msg.mine { align-self: flex-end; background: #2563eb; color: white; }
    .msg.theirs { align-self: flex-start; background: #334155; }
    .msg .meta { font-size: 10px; opacity: 0.7; margin-top: 4px; }
    .msg img, .msg video { max-width: 250px; max-height: 250px; border-radius: 8px; display: block; margin-top: 6px; }
    .msg a.download { color: #93c5fd; text-decoration: underline; display: inline-block; margin-top: 6px; font-size: 12px; }
    .progress { margin-top: 6px; height: 6px; background: #1e293b; border-radius: 3px; overflow: hidden; }
    .progress > div { height: 100%; background: #22c55e; width: 0%; transition: width 0.1s; }
    .progress-label { font-size: 11px; margin-top: 4px; opacity: 0.85; }
    #inputArea { padding: 12px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 8px; align-items: center; }
    #inputArea input[type="text"] { flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; font-size: 14px; }
    #inputArea button, #inputArea label { background: #2563eb; color: white; border: none; padding: 10px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; }
    #inputArea label { background: #475569; }
    #fileInput { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>🔗 P2P Transfer — Web</h1>
    <span id="status" class="status waiting">Bekleniyor...</span>
  </header>

  <div id="qrScreen">
    <h2>📱 Telefonunuzla QR kodu okutun</h2>
    <div id="qrcode"></div>
    <div id="peerIdText">Oturum başlatılıyor...</div>
    <p class="hint">Telefonunuzda <b>mobile.html</b> sayfasını açın ve kamerayı bu QR koda tutun. Bağlantı kurulunca sohbet ekranı otomatik açılır.</p>
  </div>

  <div id="chatScreen">
    <div id="messages"></div>
    <div id="inputArea">
      <input type="text" id="msgInput" placeholder="Mesaj yazın..." />
      <button id="sendBtn">Gönder</button>
      <label for="fileInput">📎 Dosya</label>
      <input type="file" id="fileInput" />
    </div>
  </div>

  <script>
    const CHUNK_SIZE = 16 * 1024;
    let peer = null;
    let conn = null;
    let incomingFile = null;

    const statusEl = document.getElementById('status');
    const qrScreen = document.getElementById('qrScreen');
    const chatScreen = document.getElementById('chatScreen');
    const messagesEl = document.getElementById('messages');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const fileInput = document.getElementById('fileInput');

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = 'status ' + cls;
    }

    function initPeer() {
      const myId = 'wtmug-' + Math.random().toString(36).substring(2, 10);
      peer = new Peer(myId, {
        config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
      });

      peer.on('open', (id) => {
        setStatus('QR bekleniyor', 'waiting');
        document.getElementById('peerIdText').textContent = 'Oturum ID: ' + id;
        const mobileUrl = new URL('mobile.html', location.href).href + '?id=' + id;
        new QRCode(document.getElementById('qrcode'), {
          text: mobileUrl,
          width: 260,
          height: 260,
          colorDark: '#000',
          colorLight: '#fff',
          correctLevel: QRCode.CorrectLevel.M
        });
      });

      peer.on('connection', (c) => {
        if (conn) { c.close(); return; }
        conn = c;
        setupConnection(c);
      });

      peer.on('error', (err) => {
        console.error(err);
        setStatus('Hata: ' + err.type, 'waiting');
      });
    }

    function setupConnection(c) {
      setStatus('Bağlı ✅', 'connected');
      qrScreen.style.display = 'none';
      chatScreen.style.display = 'flex';
      c.on('open', () => { console.log('Bağlantı açıldı'); });
      c.on('data', (data) => handleIncomingData(data));
      c.on('close', () => {
        setStatus('Bağlantı kapandı', 'waiting');
        chatScreen.style.display = 'none';
        qrScreen.style.display = 'flex';
      });
    }

    function sendText() {
      const text = msgInput.value.trim();
      if (!text || !conn || !conn.open) return;
      conn.send({ type: 'text', text, ts: Date.now() });
      addTextMessage(text, 'mine');
      msgInput.value = '';
    }

    sendBtn.addEventListener('click', sendText);
    msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendText(); });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file || !conn || !conn.open) return;
      sendFile(file);
      fileInput.value = '';
    });

    async function sendFile(file) {
      const fileId = 'f' + Date.now() + Math.random().toString(36).substring(2, 6);
      conn.send({ type: 'file-meta', fileId, name: file.name, size: file.size, mime: file.type || 'application/octet-stream' });
      const ui = addFileMessage(file.name, file.size, 'mine', file.type);
      let offset = 0;
      const reader = new FileReader();
      const sendNextChunk = () => {
        if (offset >= file.size) {
          conn.send({ type: 'file-end', fileId });
          ui.setProgress(100);
          ui.finalize(URL.createObjectURL(file), file.type);
          return;
        }
        reader.readAsArrayBuffer(file.slice(offset, offset + CHUNK_SIZE));
      };
      reader.onload = (ev) => {
        const chunk = ev.target.result;
        conn.send({ type: 'file-chunk', fileId, chunk });
        offset += chunk.byteLength;
        ui.setProgress(Math.floor((offset / file.size) * 100));
        setTimeout(sendNextChunk, 0);
      };
      sendNextChunk();
    }

    function handleIncomingData(data) {
      if (!data || !data.type) return;
      if (data.type === 'text') {
        addTextMessage(data.text, 'theirs');
      } else if (data.type === 'file-meta') {
        incomingFile = { fileId: data.fileId, name: data.name, size: data.size, mime: data.mime, chunks: [], received: 0 };
        incomingFile.ui = addFileMessage(data.name, data.size, 'theirs', data.mime, true);
      } else if (data.type === 'file-chunk' && incomingFile && data.fileId === incomingFile.fileId) {
        incomingFile.chunks.push(data.chunk);
        incomingFile.received += data.chunk.byteLength;
        incomingFile.ui.setProgress(Math.floor((incomingFile.received / incomingFile.size) * 100));
      } else if (data.type === 'file-end' && incomingFile) {
        const blob = new Blob(incomingFile.chunks, { type: incomingFile.mime });
        const url = URL.createObjectURL(blob);
        incomingFile.ui.finalize(url, incomingFile.mime, incomingFile.name);
        incomingFile = null;
      }
    }

    function addTextMessage(text, who) {
      const el = document.createElement('div');
      el.className = 'msg ' + who;
      el.innerHTML = escapeHtml(text) + `<div class="meta">${new Date().toLocaleTimeString('tr-TR')}</div>`;
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addFileMessage(name, size, who, mime) {
      const el = document.createElement('div');
      el.className = 'msg ' + who;
      el.innerHTML = `<div>📎 <b>${escapeHtml(name)}</b> <span style="opacity:.6">(${formatSize(size)})</span></div><div class="progress"><div></div></div><div class="progress-label">0%</div>`;
      const bar = el.querySelector('.progress > div');
      const label = el.querySelector('.progress-label');
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return {
        setProgress(pct) { bar.style.width = pct + '%'; label.textContent = pct + '%'; },
        finalize(url, type, filename) {
          label.textContent = '✅ Tamamlandı';
          if (type.startsWith('image/')) {
            const img = document.createElement('img'); img.src = url; el.appendChild(img);
          } else if (type.startsWith('video/')) {
            const v = document.createElement('video'); v.src = url; v.controls = true; el.appendChild(v);
          } else {
            const a = document.createElement('a'); a.href = url; a.download = filename || name; a.className = 'download'; a.textContent = '⬇ İndir'; a.target = '_blank'; el.appendChild(a);
          }
        }
      };
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
    }
    function formatSize(b) {
      if (b < 1024) return b + ' B';
      if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
      return (b/1048576).toFixed(1) + ' MB';
    }

    initPeer();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(console.warn);
  </script>
</body>
</html>
