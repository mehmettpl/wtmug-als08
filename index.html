<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2P Transfer — Web</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 12px 20px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .status { font-size: 13px; padding: 4px 10px; border-radius: 12px; background: #475569; }
    .status.connected { background: #16a34a; }
    .status.waiting { background: #ca8a04; }
    .status.error { background: #dc2626; }
    #qrScreen { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; padding: 20px; }
    #qrcode { background: #fff; padding: 16px; border-radius: 12px; }
    #chatScreen { flex: 1; display: none; flex-direction: column; overflow: hidden; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 70%; padding: 10px 14px; border-radius: 12px; word-wrap: break-word; font-size: 14px; }
    .msg.mine { align-self: flex-end; background: #2563eb; color: white; }
    .msg.theirs { align-self: flex-start; background: #334155; }
    #inputArea { padding: 12px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 8px; align-items: center; }
    #inputArea input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #475569; background: #0f172a; color: #fff; }
    #inputArea button { background: #2563eb; color: white; border: none; padding: 10px 16px; border-radius: 20px; cursor: pointer; }
    #debugLog { position: fixed; bottom: 0; left: 0; right: 0; max-height: 150px; overflow-y: auto; background: #000e; color: #0f0; font-family: monospace; font-size: 11px; padding: 8px; display: none; z-index: 9999; }
    #debugLog.show { display: block; }
  </style>
</head>
<body>
  <header>
    <h1>🔗 P2P Transfer — Web</h1>
    <span id="status" class="status waiting">Bekleniyor...</span>
  </header>

  <div id="qrScreen">
    <h2>📱 Telefonunuzla QR kodu okutun</h2>
    <div id="qrcode"></div>
    <p style="font-size:12px;color:#64748b">Uçtan uca şifreli, sunucusuz bağlantı</p>
    <button onclick="document.getElementById('debugLog').classList.toggle('show')" style="background:#475569;color:white;border:none;padding:8px 16px;border-radius:20px;cursor:pointer;">🐛 Log</button>
  </div>

  <div id="chatScreen">
    <div id="messages"></div>
    <div id="inputArea">
      <input type="text" id="msgInput" placeholder="Mesaj yazın..." />
      <button id="sendBtn">Gönder</button>
      <label for="fileInput" style="background:#475569;color:white;padding:10px 16px;border-radius:20px;cursor:pointer;">📎 Dosya</label>
      <input type="file" id="fileInput" style="display:none" />
    </div>
  </div>
  <div id="debugLog"></div>

  <script>
    // === ÇOKLU VE GÜVENİLİR TURN SUNUCULARI ===
    const ICE_SERVERS = [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun2.l.google.com:19302' },
      { urls: 'stun:stun3.l.google.com:19302' },
      // OpenRelay (Bazen çalışır)
      { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
    ];

    const CHUNK_SIZE = 16 * 1024;
    let pc = null;
    let dataChannel = null;
    let incomingFile = null;
    let roomId = Math.random().toString(36).substring(2, 10);

    const debugLog = document.getElementById('debugLog');
    const log = (msg) => {
      debugLog.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
      debugLog.scrollTop = debugLog.scrollHeight;
      console.log(msg);
    };

    const setStatus = (text, cls) => {
      const el = document.getElementById('status');
      el.textContent = text;
      el.className = 'status ' + cls;
    };

    async function initHost() {
      log('Oda oluşturuluyor: ' + roomId);
      
      const mobileUrl = new URL('mobile.html', location.href).href + '?room=' + roomId;
      new QRCode(document.getElementById('qrcode'), {
        text: mobileUrl, width: 260, height: 260,
        colorDark: '#000', colorLight: '#fff', correctLevel: QRCode.CorrectLevel.M
      });

      pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
      
      dataChannel = pc.createDataChannel('fileTransfer', { ordered: true });
      setupDataChannel(dataChannel);

      pc.oniceconnectionstatechange = () => {
        log('🧊 ICE: ' + pc.iceConnectionState);
        if (pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'disconnected') {
          setStatus('Bağlantı koptu, yeniden deneniyor...', 'error');
          // ICE Restart mekanizması
          if (pc.restartIce) { pc.restartIce(); }
        }
      };
      pc.onconnectionstatechange = () => log('🔌 PC: ' + pc.connectionState);

      pc.onicecandidate = (event) => {
        if (event.candidate) sendSignal('host-ice', event.candidate);
      };

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      log('Offer oluşturuldu, telefondan yanıt bekleniyor...');
      
      await sendSignal('host-offer', offer);

      waitForSignal('mobile-answer', async (answer) => {
        log('Answer alındı, bağlantı kuruluyor...');
        if (pc.signalingState !== 'closed') {
          await pc.setRemoteDescription(new RTCSessionDescription(answer));
          setStatus('Bağlanıyor...', 'waiting');
        }
      });

      waitForSignal('mobile-ice', async (candidate) => {
        if (pc && pc.signalingState !== 'closed') {
          try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch(e){}
        }
      });
    }

    function setupDataChannel(channel) {
      channel.onopen = () => {
        log('✅ DataChannel AÇILDI!');
        setStatus('Bağlı ✅', 'connected');
        document.getElementById('qrScreen').style.display = 'none';
        document.getElementById('chatScreen').style.display = 'flex';
      };

      channel.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'text') addTextMessage(data.text, 'theirs');
        else if (data.type === 'file-meta') {
          incomingFile = { fileId: data.fileId, name: data.name, size: data.size, mime: data.mime, chunks: [], received: 0 };
          incomingFile.ui = addFileMessage(data.name, data.size, 'theirs');
        } else if (data.type === 'file-chunk' && incomingFile && data.fileId === incomingFile.fileId) {
          const binary = atob(data.chunk);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          incomingFile.chunks.push(bytes.buffer);
          incomingFile.received += bytes.length;
          incomingFile.ui.setProgress(Math.floor((incomingFile.received / incomingFile.size) * 100));
        } else if (data.type === 'file-end' && incomingFile) {
          const blob = new Blob(incomingFile.chunks, { type: incomingFile.mime });
          incomingFile.ui.finalize(URL.createObjectURL(blob), incomingFile.mime, incomingFile.name);
          incomingFile = null;
        }
      };

      channel.onclose = () => {
        log('❌ Bağlantı kapandı');
        setStatus('Bağlantı kapandı', 'waiting');
      };
    }

    // === SİNYALLEŞME (JSONBIN.IO API) ===
    const API_KEY = '$2b$10$q1Vb.Wq.f2V3Y8p7XzN8O.5XbVq1W9T2r4Y6u8I0O2E4A6S8D0F2';
    const BIN_ID = '65c9f1f4dc7465401882b524';
    
    async function sendSignal(key, data) {
      try {
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
          body: JSON.stringify({ [key]: data, timestamp: Date.now() })
        });
      } catch(e) {}
    }

    function waitForSignal(key, callback) {
      let lastData = null;
      const interval = setInterval(async () => {
        try {
          const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
            headers: { 'X-Master-Key': API_KEY }
          });
          const json = await res.json();
          const val = json.record[key];
          if (val && JSON.stringify(val) !== JSON.stringify(lastData)) {
            lastData = val;
            callback(val);
          }
        } catch(e) {}
      }, 1500);
      setTimeout(() => clearInterval(interval), 120000);
    }

    function sendText() {
      const text = document.getElementById('msgInput').value.trim();
      if (!text || !dataChannel || dataChannel.readyState !== 'open') return;
      dataChannel.send(JSON.stringify({ type: 'text', text }));
      addTextMessage(text, 'mine');
      document.getElementById('msgInput').value = '';
    }

    document.getElementById('sendBtn').onclick = sendText;
    document.getElementById('msgInput').onkeydown = (e) => { if (e.key === 'Enter') sendText(); };

    document.getElementById('fileInput').onchange = (e) => {
      const file = e.target.files[0];
      if (!file || !dataChannel || dataChannel.readyState !== 'open') return;
      
      const fileId = 'f' + Date.now();
      dataChannel.send(JSON.stringify({ type: 'file-meta', fileId, name: file.name, size: file.size, mime: file.type }));
      const ui = addFileMessage(file.name, file.size, 'mine');
      
      let offset = 0;
      const reader = new FileReader();
      const next = () => {
        if (offset >= file.size) {
          dataChannel.send(JSON.stringify({ type: 'file-end', fileId }));
          ui.setProgress(100); ui.finalize(URL.createObjectURL(file), file.type);
          return;
        }
        reader.readAsArrayBuffer(file.slice(offset, offset + CHUNK_SIZE));
      };
      reader.onload = (ev) => {
        const binary = String.fromCharCode.apply(null, new Uint8Array(ev.target.result));
        dataChannel.send(JSON.stringify({ type: 'file-chunk', fileId, chunk: btoa(binary) }));
        offset += ev.target.result.byteLength;
        ui.setProgress(Math.floor((offset / file.size) * 100));
        setTimeout(next, 0);
      };
      next();
      e.target.value = '';
    };

    function addTextMessage(text, who) {
      const el = document.createElement('div');
      el.className = 'msg ' + who;
      el.textContent = text;
      document.getElementById('messages').appendChild(el);
      document.getElementById('messages').scrollTop = 99999;
    }

    function addFileMessage(name, size, who) {
      const el = document.createElement('div');
      el.className = 'msg ' + who;
      el.innerHTML = `<div>📎 <b>${name}</b></div><div class="progress" style="height:6px;background:#1e293b;margin-top:6px"><div style="height:100%;background:#22c55e;width:0%"></div></div><div class="progress-label" style="font-size:11px">0%</div>`;
      const bar = el.querySelector('.progress > div');
      const label = el.querySelector('.progress-label');
      document.getElementById('messages').appendChild(el);
      return {
        setProgress: (p) => { bar.style.width = p + '%'; label.textContent = p + '%'; },
        finalize: (url, type) => {
          label.textContent = '✅ Tamamlandı';
          if (type.startsWith('image/')) el.innerHTML += `<img src="${url}" style="max-width:200px;border-radius:8px;margin-top:6px">`;
          else el.innerHTML += `<a href="${url}" download="${name}" style="color:#93c5fd;display:block;margin-top:6px">⬇ İndir</a>`;
        }
      };
    }

    initHost();
  </script>
</body>
</html>
